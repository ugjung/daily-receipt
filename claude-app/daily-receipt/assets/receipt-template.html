<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘 한 일 영수증</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 감열지 영수증 한 장. 위아래 톱니, 주황 포인트는 로고, 엠블럼, 합계 띠, 인사말에만. */
:root{
  --bg:#e7e6e3; --paper:#ffffff; --ink:#222222; --sub:#7a7a7a; --line:#9a9a9a; --soft:#555555; --track:#ececec;
  --accent:#e4572e; --on-accent:#ffffff;
  --mono:'IBM Plex Mono','Nanum Gothic Coding','D2Coding',Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1d1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1d1f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);display:flex;flex-direction:column;align-items:center;padding:48px 16px 56px}
.stage{width:100%;max-width:420px;transform:rotate(-1.2deg);filter:drop-shadow(0 14px 22px rgba(0,0,0,.18)) drop-shadow(0 2px 3px rgba(0,0,0,.08))}
@media (prefers-reduced-motion:reduce){.stage{transform:none}}
.paper{position:relative;background:var(--paper);color:var(--ink);padding:30px 26px 26px;font-size:13px;line-height:1.55;margin:12px 0}
.paper:before,.paper:after{content:"";position:absolute;left:0;right:0;height:12px;background-size:16px 12px;background-repeat:repeat-x}
.paper:before{top:-12px;background-image:linear-gradient(-135deg,transparent 8px,var(--paper) 0),linear-gradient(135deg,transparent 8px,var(--paper) 0);background-position:left top}
.paper:after{bottom:-12px;background-image:linear-gradient(-45deg,transparent 8px,var(--paper) 0),linear-gradient(45deg,transparent 8px,var(--paper) 0);background-position:left bottom}

.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.logo{color:var(--accent);font-weight:700;font-size:32px;line-height:1;letter-spacing:.02em}
.logo small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;margin-top:8px}
.emblem{flex:none;width:52px;height:52px}
.emblem circle,.emblem path{stroke:var(--accent);fill:none}

.dots{border-top:1.5px dotted var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:12px}
.kv span:first-child{color:var(--sub);white-space:nowrap}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.head{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.06em;margin-bottom:12px}

.group{display:flex;align-items:baseline;gap:6px;margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--accent)}
.group:first-child{margin-top:0}
.group .gsum{color:var(--sub);font-weight:400;white-space:nowrap}
.row{display:flex;align-items:baseline;gap:6px}
.no{color:var(--sub);font-size:11px}
.kind{font-size:10px;border:1px solid var(--ink);padding:0 4px;line-height:15px;white-space:nowrap;align-self:center}
.name{font-weight:700;word-break:keep-all;min-width:0}
.main{font-size:9px;background:var(--accent);color:var(--on-accent);padding:0 4px;line-height:14px;letter-spacing:.08em;align-self:center}
.lead{flex:1;border-bottom:1px dotted var(--line);min-width:12px;transform:translateY(-4px)}
.amt{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.item{margin-bottom:11px}
.item.in{padding-left:10px;border-left:2px solid var(--accent);margin-left:2px}
.done{color:var(--soft);font-size:11.5px;padding-left:22px;word-break:keep-all;margin-top:1px}
.bar{margin:4px 0 0 22px;height:3px;background:var(--track)}
.bar i{display:block;height:100%;background:var(--ink)}

.total{display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:var(--on-accent);padding:12px 14px;margin:14px -8px;font-weight:700}
.total span:first-child{font-size:17px;letter-spacing:.06em}
.total span:last-child{font-size:26px;font-variant-numeric:tabular-nums}
.sec{font-weight:700;letter-spacing:.06em;margin-bottom:6px}
.carry{font-size:12px;word-break:keep-all}
.memo{text-align:center;font-size:14px;font-weight:700;margin:4px 0 0;word-break:keep-all}
.barcode{height:40px;margin:16px 12px 4px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.code{text-align:center;font-size:10px;letter-spacing:.3em;color:var(--sub)}
.thanks{text-align:center;margin-top:14px}
.thanks b{display:block;font-weight:400}
.thanks em{display:block;font-style:normal;color:var(--accent);font-weight:700;letter-spacing:.08em;margin-top:4px}
.foot{text-align:center;color:var(--sub);font-size:10.5px;margin-top:10px}

.actions{display:flex;gap:8px;margin-top:28px;flex-wrap:wrap;justify-content:center}
button{font-family:var(--mono);border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;cursor:pointer}
button.ghost{background:var(--paper);color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre#plain{display:none;max-width:420px;width:100%;white-space:pre-wrap;background:var(--paper);color:var(--ink);padding:12px;font-family:var(--mono);font-size:12px;margin-top:12px}
</style>
</head>
<body>
<!-- 바꾸는 곳은 아래 DATA 블록의 JSON 하나뿐. 나머지는 그대로 둔다. -->
<script type="application/json" id="data">
{
  "date": "2026-10-13",
  "weekday": "화",
  "store": "모비데이즈 AX팀",
  "customer": "홍길동",
  "issued_at": "20261013180012",
  "payments": ["Claude Opus 5.5"],
  "items": [
    {"group": "광고주발굴", "kind": "기획", "name": "기획 재정리", "minutes": 30, "done": "기존 자료 점검, 기획 다시 작성"},
    {"group": "광고주발굴", "kind": "분석", "name": "타깃 정의", "minutes": 14, "done": "성사 사례 보고 우선 타깃 선정"},
    {"group": "", "kind": "문서", "name": "주간 보고 정리", "minutes": 20, "done": "팀 주간 보고 초안 완성"}
  ],
  "carry_over": ["담당자에게 전체 기간 데이터 요청"],
  "one_liner": "기획부터 첫 수집까지 한 바퀴"
}
</script>

<div class="stage"><div class="paper" id="receipt"></div></div>
<div class="actions"><button type="button" id="save" hidden>이미지로 저장</button><button type="button" class="ghost" id="cp">텍스트 복사</button></div>
<pre id="plain"></pre>

<script>
(function(){
  var r = JSON.parse(document.getElementById('data').textContent);
  var items = r.items || [];
  var hasMin = items.length > 0 && items.every(function(i){ return typeof i.minutes === 'number'; });
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function dur(m){ var h = Math.floor(m/60), mm = m%60; return h ? h+'시간 '+(mm<10?'0':'')+mm+'분' : mm+'분'; }
  function weight(i){ return hasMin ? i.minutes : (i.chats || 1); }
  function amount(i){ return hasMin ? dur(i.minutes) : '대화 '+(i.chats || 1)+'회'; }
  function fmt(n){ return hasMin ? dur(n) : '대화 '+n+'회'; }
  var top = Math.max.apply(null, items.map(weight).concat([1]));
  var approval = r.issued_at || '';
  var receiptNo = approval ? 'TD' + approval.slice(2, 8) + '-' + approval.slice(8, 12) : '';

  var groups = [], byName = {};
  items.forEach(function(i){ var g = i.group || ''; if(!(g in byName)){ byName[g] = []; groups.push(g); } byName[g].push(i); });

  var html = [], text = [], n = 0;
  groups.forEach(function(g){
    var members = byName[g], boxed = g && members.length > 1;
    if(boxed){
      var sub = members.reduce(function(a,i){ return a + weight(i); }, 0);
      html.push('<div class="group"><span>■ '+esc(g)+'</span><span class="lead"></span><span class="gsum">'+fmt(sub)+'</span></div>');
      text.push('■ '+g+'  ('+fmt(sub)+')');
    }
    members.forEach(function(i){
      n++;
      var no = (n<10?'0':'')+n;
      var name = boxed && i.name.indexOf(g) === 0 ? (i.name.slice(g.length).trim() || i.name) : i.name;
      var kind = i.kind ? '<span class="kind">'+esc(i.kind)+'</span>' : '';
      var main = weight(i) === top ? '<span class="main">MAIN</span>' : '';
      var pct = Math.max(4, Math.round(weight(i)/top*100));
      html.push('<div class="item'+(boxed?' in':'')+'"><div class="row"><span class="no">'+no+'</span>'+kind+'<span class="name">'+esc(name)+'</span>'+main+'<span class="lead"></span><span class="amt">'+esc(amount(i))+'</span></div>'+
        (i.done ? '<div class="done">'+esc(i.done)+'</div>' : '')+'<div class="bar"><i style="width:'+pct+'%"></i></div></div>');
      text.push(' '+no+' '+(i.kind?'['+i.kind+'] ':'')+name+' .. '+amount(i));
      if(i.done) text.push('     ㄴ '+i.done);
    });
  });

  var total = items.reduce(function(a,i){ return a + weight(i); }, 0);
  var pays = (r.payments && r.payments.length ? r.payments : ['Claude']).map(function(p, k){
    return '<div class="kv"><span>'+(k===0?'결제수단':'')+'</span><span>'+esc(p)+'</span></div>';
  }).join('');
  var carry = r.carry_over || [];

  var emblem = '<svg class="emblem" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" stroke-width="2"/><circle cx="26" cy="26" r="18.5" stroke-width="1"/><path d="M17 26.5l6 6 12-13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  document.getElementById('receipt').innerHTML =
    '<div class="brand"><div class="logo">TO DONE<small>TODAY\'S RECEIPT</small></div>'+emblem+'</div>'+
    '<div class="dots"></div>'+
    (r.store ? '<div class="kv"><span>상호</span><span>'+esc(r.store)+'</span></div>' : '')+
    (r.customer ? '<div class="kv"><span>고객</span><span>'+esc(r.customer)+'</span></div>' : '')+
    '<div class="kv"><span>일시</span><span>'+esc(r.date)+' ('+esc(r.weekday)+')</span></div>'+
    (receiptNo ? '<div class="kv"><span>승인번호</span><span>'+esc(receiptNo)+'</span></div>' : '')+
    '<div class="dots"></div>'+
    '<div class="head"><span>품명</span><span>'+(hasMin?'사용시간':'대화 수')+'</span></div>'+
    html.join('')+
    '<div class="dots"></div>'+
    '<div class="kv"><span>품목 수</span><span>'+items.length+'</span></div>'+
    pays+
    '<div class="total"><span>TOTAL</span><span>'+esc(fmt(total))+'</span></div>'+
    (carry.length ? '<div class="sec">내일로 이월</div>'+carry.map(function(c){ return '<div class="carry">- '+esc(c)+'</div>'; }).join('')+'<div class="dots"></div>' : '')+
    (r.one_liner ? '<div class="memo">"'+esc(r.one_liner)+'"</div>' : '')+
    '<div class="barcode"></div><div class="code">'+esc(approval)+'</div>'+
    '<div class="thanks"><b>오늘도 수고하셨습니다!</b><em>THANK YOU!</em></div>'+
    (hasMin ? '<div class="foot">※ 사용시간은 Claude와 대화한 시간 기준</div>' : '');

  var plain = ['🧾 TO DONE  오늘 한 일 영수증', r.date+' ('+r.weekday+')'+(r.customer ? '  '+r.customer : ''), '----------------------------']
    .concat(text, ['----------------------------', 'TOTAL  '+fmt(total)], carry.map(function(c){ return '이월  '+c; }), r.one_liner ? ['"'+r.one_liner+'"'] : [])
    .join('\n');

  var cp = document.getElementById('cp'), pre = document.getElementById('plain');
  cp.addEventListener('click', function(){
    function ok(){ cp.textContent = '복사됨'; setTimeout(function(){ cp.textContent = '텍스트 복사'; }, 1500); }
    function show(){ pre.textContent = plain; pre.style.display = 'block'; var rg = document.createRange(); rg.selectNodeContents(pre); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); cp.textContent = '선택됨, Ctrl+C'; }
    try { navigator.clipboard.writeText(plain).then(ok, show); } catch(e) { show(); }
  });

  // 이미지 저장은 내 PC에서 파일로 열었을 때만 보인다. 누를 때만 라이브러리를 불러온다.
  var save = document.getElementById('save');
  if (location.protocol === 'file:') {
    save.hidden = false;
    save.addEventListener('click', function(){
      function go(){ html2canvas(document.getElementById('receipt'), {scale: 2, backgroundColor: null}).then(function(c){ var a = document.createElement('a'); a.download = '영수증_'+r.date+'.png'; a.href = c.toDataURL(); a.click(); }); }
      if (window.html2canvas) return go();
      var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload = go; document.head.appendChild(s);
    });
  }
})();
</script>
</body>
</html>
